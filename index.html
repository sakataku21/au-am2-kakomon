<footer class="colophon">
  <p>問題・正解の出典：独立行政法人情報処理推進機構（IPA）が公開しているシステム監査技術者試験 午前Ⅱの問題冊子と解答例（平成31年度春期〜令和7年度秋期）。問題は問題冊子から問ごとに切り出して掲載しています。解説は、Web上の解説サイト（IPA Advanced、サクトレWeb）と基準類の原典などを照合し、本アプリで要約・再構成したものです。IPAの公式な解説ではありません。参考にした解説・資料は各問の解説の下に記載しています。</p>
  <p><a href="https://www.ipa.go.jp/shiken/mondai-kaiotu/index.html" target="_blank" rel="noopener">IPA 過去問題のページ</a></p>
</footer>
